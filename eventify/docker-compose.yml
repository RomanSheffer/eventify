
services:
#  # 1. Фронтенд в Docker с моками (демонстрация)
  frontend-mocks:
    build: .
    ports:
      - "3000:80"
    environment:
      - REACT_APP_USE_MOCKS=true
    profiles:
      - docker-mocks
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 2. Фронтенд в Docker с реальным бэкендом (порт 8080 должен быть свободен)
  frontend-backend:
    build:
      context: ./booking-ui
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:8080
        - REACT_APP_USE_MOCKS=false
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8080
      - REACT_APP_USE_MOCKS=false
    profiles:
      - docker-backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres-db:
      image: postgres:15-alpine
      container_name: eventify_postgres
      environment:
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_DB: ${DB_NAME}
      ports:
        - "${DB_PORT}:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data
      networks:
        - default

  backend:
      build:
        context: ./eventify-backend
        dockerfile: Dockerfile
      container_name: eventify_backend
      ports:
        - "${BACKEND_PORT}:8080"
      environment:
        - SPRING_PROFILES_ACTIVE=${SPRING_PROFILE}
        - SPRING_DATASOURCE_URL=${DB_URL}
        - SPRING_DATASOURCE_USERNAME=${DB_USER}
        - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
        - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      depends_on:
        - postgres-db
      networks:
        - default

volumes:
  pgdata:

networks:
  default:
    name: event-booking-network
